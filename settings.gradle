pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/davidggjg/zovex-signer")
            credentials {
                username = System.getenv("ORG_GRADLE_PROJECT_githubPackagesUsername") ?: ""
                password = System.getenv("ORG_GRADLE_PROJECT_githubPackagesPassword") ?: ""
            }
        }
    }
}
rootProject.name = "ZovexInjector"
include ':app'
